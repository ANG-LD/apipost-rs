<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!--
    「历史记录」自绘图标（原创几何，非取自任何图标库文件）。

    为什么是"钟面 + 逆时针回溯箭头"：
      之前用的 Undo2 只有一根回退箭头，用户一眼读成"撤销操作"——因为缺少"时间"这个锚点。
      钟表是"过去/时间"最强的通用符号，把回退箭头骑在钟面圆周上，
      语义就锁定成"回到过去的记录"，而不再是"撤销刚才那步"。

    与现有图标集（Lucide 网格）保持同一套设计语言，避免看起来像外来的：
      viewBox 24×24、描边 2、圆头圆角，图形（含描边）铺满 2..22。
      这样渲染到 14px 时，线宽与相邻图标完全一致（14px × 2/24 ≈ 1.17px）。

    为什么必须铺到 2..22，而不是更"保险"的 4..20：
      第一版我按 4..20 画（圆半径 8），结果一眼就被看出"比旁边图标小了一点"。
      原因是组件库那套 Lucide 图标的墨迹普遍铺到 2..22；在同一个 14px 尺寸下，
      只占 16 单位的图形固有地比占 18~19 单位的邻居小约 10%。
      于是这里把半径放大到 9（描边外缘正好落在 2..22）补齐视觉尺寸，
      而不是去动渲染尺寸 —— 14px 是 IconTier::Regular 这个全应用共享档位，
      单独给一个图标调大尺寸会破坏整套图标的尺寸纪律。

    颜色用 currentColor 不写死：本项目图标有"跟随容器文字色"的规则
      （侧栏 tab 选中/hover 时容器换文字色，图标必须跟着换），
      写死颜色会让选中态失效。

    构图（三段，都很简单，保证 14px 下不糊）：
      ① 钟面：圆心 (12,12)、半径 9，从左上 (3.3,9.7) 顺时针绕一大圈回到 (3.3,14.3)，
         左边留 30° 缺口放箭头；
      ② 指针：指向 12 点再折向 4 点方向，明确是"某一刻"而不是刻度；
      ③ 箭头：缺口处一个指向逆时针（向左上回溯）的箭头。
  -->
  <path d="M3.3 9.7 A9 9 0 1 1 3.3 14.3" />
  <path d="M12 6.8 V12.3 L16 14.3" />
  <path d="M5.7 9.9 L3.3 9.7 L4.2 12.1" />
</svg>
