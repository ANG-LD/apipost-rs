name = "apipost-rs"
product-name = "ApiPost-Rs"
version = "0.2.1"
identifier = "com.apipost-rs.apipost-rs"
description = "A Postman alternative built with Rust and gpui"
homepage = "https://github.com/ANG-LD/apipost-rs"
authors = ["Lidong yang <735615901@qq.com>"]
publisher = "Lidong yang <735615901@qq.com>"
license-file = "LICENSE"
copyright = "Copyright 2025 apipost-rs team"
category = "Development"

# 三个平台的图标都要给，缺一个那个平台的图标就是默认白板：
#   Windows -> .ico（安装器 + exe 资源，桌面快捷方式图标取自 exe）
#   macOS   -> .icns（App 包 CFBundleIconFile）
#   Linux   -> .png（deb 装到 /usr/share/icons/hicolor/<尺寸>/apps/）
#
# Linux 的 PNG 必须是 hicolor 主题的标准尺寸：cargo-packager 按图片自身像素
# 决定装进哪个目录，用 1024x1024 的母版会装到 hicolor/1024x1024/ 下，而
# 该目录不在主题的 index.theme 里 → Icon= 解析不到 → 桌面/启动器图标空白。
# 所以这里列的是从母版缩出的标准尺寸（assets/icons/ 下）。
icons = [
    "assets/icons/512x512.png",
    "assets/icons/256x256.png",
    "assets/icons/128x128.png",
    "assets/icons/64x64.png",
    "assets/icons/48x48.png",
    "assets/icons/32x32.png",
    "assets/icons/16x16.png",
    "assets/icon.ico",
    "assets/icon.icns",
]

out-dir = "./dist"
binaries = [{ path = "apipost-rs", main = true }]
# 固定为 target/release：macOS 的通用二进制由工作流额外复制到这里（见 release.yml
# 的 lipo 合并步骤）。实测省略本字段不会按 --target 解析，反而会去 out-dir(dist/) 找。
binaries-dir = "target/release"

[linux]
generate-desktop-entry = true

[macos]
# gpui / winit 与 wgpu 的最低要求；写死避免默认值过高把老系统挡在门外
minimum-system-version = "11.0"
# 签名路径（CI 里配了 APPLE_CERTIFICATE 时）走 hardened runtime，必须带这份
# entitlement，否则 wgpu 运行时生成机器码会被系统拒绝、app 启动即被杀。
# 未签名打包不读它，所以 Linux/Windows 构建不受影响。
entitlements = "assets/macos/entitlements.plist"

[deb]
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libglib2.0-0", "libc6", "libx11-6", "libwayland-client0"]
# 用仓库里自己写的 desktop 条目（带 Keywords / StartupWMClass，任务栏图标分组更准）
desktop-template = "assets/apipost-rs.desktop"
section = "utils"
priority = "optional"

[nsis]
installer-mode = "currentUser"
# 安装器自己的图标（安装向导窗口/控制面板里显示的图标）
installer-icon = "assets/icon.ico"
