[package]
name = "apipost-rs"
version = "0.1.0"
edition = "2021"
description = "A Postman alternative built with Rust and gpui"
license = "MIT"
authors = ["apipost-rs team"]
repository = "https://github.com/apipost-rs/apipost-rs"

[dependencies]
# GUI framework
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", branch = "main" }
# 可选：使用内置默认资源
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies", "multipart"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internationalization
i18n-embed = { version = "0.15", features = ["fluent"] }
fluent-uri = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
anyhow = "1"
thiserror = "2"
shlex = "1"
directories = "6"
dirs = "6"
toml = "0.8"
base64 = "0.22"
url = "2"
urlencoding = "2"
arboard = "3"
flate2 = "1.0"
log = "0.4"
env_logger = "0.11"
rfd = "0.14"

[dev-dependencies]
tempfile = "3"
