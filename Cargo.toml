[package]
name = "apipost-rs"
version = "0.1.0"
edition = "2021"
description = "A Postman alternative built with Rust and gpui"
license = "MIT"
authors = ["apipost-rs team"]
repository = "https://github.com/apipost-rs/apipost-rs"

[dependencies]
# GUI framework
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", branch = "main" }
# 可选：使用内置默认资源
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies", "multipart", "gzip", "brotli", "charset", "http2"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Internationalization
i18n-embed = { version = "0.15", features = ["fluent"] }
fluent-uri = "0.1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
anyhow = "1"
thiserror = "2"
shlex = "1"
directories = "6"
dirs = "6"
toml = "0.8"
base64 = "0.22"
url = "2"
urlencoding = "2"
arboard = "3"
# flate2 = "1.0"
flate2 = { version = "1.1", features = ["zlib-rs"], default-features = false } # 使用zlib-rs解压
brotli = "8"
image = "0.25"
smallvec = "1"
log = "0.4"
env_logger = "0.11"
rfd = "0.17.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"

[lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "allow"
type_complexity = "allow"
needless_update = "allow"
option_map_unit_fn = "allow"
too_many_arguments = "allow"
mutable_key_type = "allow"

[profile.dev]
opt-level = 1            # 轻量优化，平衡编译速度和文件大小
codegen-units = 16       # 保持快速编译
debug = "limited"        # 有限的调试信息
split-debuginfo = "unpacked"
strip = "debuginfo"      # 移除调试信息但保留符号表

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

[profile.release]
opt-level = "z"          # 优化目标为大小 (size optimization)
lto = "fat"              # 完整的链接时优化 (full LTO)
codegen-units = 1        # 最小化编译单元以获得最佳优化
strip = true             # 自动移除符号和调试信息
panic = "abort"          # 使用 abort 代替 unwind，减少二进制大小
